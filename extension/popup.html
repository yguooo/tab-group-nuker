<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 13px system-ui; width: 300px; margin: 0; padding: 14px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; font-size: 13px; border: 0; border-radius: 6px; cursor: pointer; }
  #nuke { background: #d93025; color: #fff; font-weight: 600; }
  .hint { color: #666; font-size: 12px; line-height: 1.4; }
  #out { margin-top: 8px; font-weight: 600; min-height: 1.2em; }
  .auto { margin-top: 14px; padding-top: 10px; border-top: 1px solid #eee; }
</style></head>
<body>
  <h1>Tab Group Nuker</h1>
  <div class="hint">Open groups right now: <b id="count">…</b></div>
  <div id="out"></div>
  <button id="nuke">Delete all open groups</button>
  <div class="hint auto">Groups that Chrome restores at launch are removed automatically for the first two minutes after startup. Shortcut: <b>⌘⇧X</b> (Ctrl+Shift+X on Windows/Linux).</div>
  <script src="popup.js"></script>
</body></html>
